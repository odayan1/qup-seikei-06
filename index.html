<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>経済3 国民所得・金融・財政｜Q-UP塾 公共・政経</title>
<meta name="theme-color" content="#0e6f78">
<meta name="description" content="共通テスト「公共，政治・経済」経済3。GDP・GNIの計算、金融政策、財政と税を、動画と同じ順番で復習＋共通テスト形式の問題。">
<style>
:root{--main:#0e6f78;--main2:#17939e;--soft:#e6f5f5;--acc:#ff6b57;--acc2:#ffe0db;--ink:#22303c;--bg:#f5f9f9;--ok:#1f9d55;--ng:#d64545;--gold:#d4a017;--small:#2f7fd1;--big:#e0782f;--ky:#4b3fa3;--kysoft:#efedfb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;word-break:auto-phrase;line-break:strict;text-wrap:pretty}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{background:var(--main);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header .logo{height:34px;width:auto;cursor:pointer;display:block}
header .ttl{border-left:1px solid rgba(255,255,255,.35);padding-left:10px;min-width:0}
header .t1{font-size:11px;opacity:.85;white-space:nowrap}
header .t2{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .t2 span{color:#ffb3a7}
header .pt{margin-left:auto;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px;font-weight:700;font-size:13px;flex:none}
.card{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 2px 10px rgba(20,60,60,.07)}
h1{font-size:21px;margin:2px 0 4px;color:var(--main)}
h2{font-size:18px;margin:0 0 8px;color:var(--main)}
.muted{color:#6b7885;font-size:13px;line-height:1.6}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;margin-top:12px;font-family:inherit;text-align:center;text-decoration:none}
.btn.main{background:var(--acc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn.main:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.sub{background:var(--soft);color:var(--main)}
.btn.lab{background:#efe9fb;color:#5b3fa3}
.btn.ky{background:var(--ky);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn:disabled{opacity:.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 .btn{margin-top:12px}
.bubble{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.bubble img{width:50px;height:50px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--soft)}
.bubble div{background:var(--soft);border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:15px;line-height:1.7}
/* 動画への入口（先生の画像は小さく） */
.vcard{display:flex;align-items:center;gap:12px;margin-top:12px;border:2px solid #f3c4c2;border-radius:14px;padding:8px;text-decoration:none;color:var(--ink);background:#fff}
.vcard img{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;flex:none}
.vcard b{display:block;color:#c4302b;font-size:16px}.vcard small{color:#6b7885;font-size:12px}
.intro-logo{display:block;width:100%;max-width:300px;margin:0 auto;border-radius:12px}
.menu{display:grid;gap:10px;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid #e1ecec;border-radius:14px;padding:12px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.item .ic{font-size:26px;width:34px;text-align:center;flex:none}.item b{display:block;font-size:15px}.item small{color:#6b7885;font-size:12px;display:block}
.item .hs{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;color:var(--main);background:var(--soft);border-radius:99px;padding:1px 8px}
.item .done{margin-left:auto;font-size:12px;color:var(--ok);font-weight:800;flex:none}
.item.labi{border-color:#d9cdf5;background:#faf7ff}.item.trap{border-color:#ffd1c9;background:#fffaf8}.item.test{border-color:var(--main2);background:var(--soft)}
.item.kyi{border-color:#cbc4f0;background:var(--kysoft)}.item.kyi .hs{background:#fff;color:var(--ky)}
.sec{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.06em;margin-top:20px}
.sec.ky{color:var(--ky)}
.secnote{font-size:12px;color:#6b7885;margin-top:2px}
.prog{display:flex;gap:4px;margin-top:4px}.prog i{flex:1;height:6px;border-radius:9px;background:#dfe7e7}.prog i.d{background:var(--main2)}.prog i.c{background:var(--acc)}
.stage{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.04em;margin-top:6px}
.fmt{display:inline-block;background:var(--ky);color:#fff;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 8px;margin-top:8px}
.q{font-size:17px;font-weight:700;line-height:1.6;margin-top:8px}
.choices{display:grid;gap:9px;margin-top:12px}
.choices button{border:2px solid #dde6e6;background:#fff;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink);line-height:1.5;font-family:inherit}
.choices.kyc button{font-size:15px;font-weight:500;padding:11px 12px}
.choices button .no{font-weight:900;color:var(--ky);margin-right:6px}
.choices button.ok{border-color:var(--ok);background:#e7f6ee}
.choices button.ng{border-color:var(--ng);background:#fdecec}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tf button{font-size:40px;font-weight:900;padding:14px;border-radius:16px;border:2px solid #dde6e6;background:#fff;cursor:pointer;font-family:inherit}
.tf button.o{color:var(--ok)}.tf button.x{color:var(--ng)}
.tf button.ok{background:#e7f6ee;border-color:var(--ok)}.tf button.ng{background:#fdecec;border-color:var(--ng)}
.answer{min-height:56px;border:2px dashed #c9dede;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-top:12px}
.answer .ph{color:#9aa7b0;font-size:13px;padding:8px}
.pool{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chip{border:2px solid var(--main2);background:#fff;color:var(--main);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:700;cursor:pointer;text-align:left;font-family:inherit}
.answer .chip{background:var(--main2);color:#fff}
.answer .chip b{display:inline-block;background:#fff;color:var(--main);border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:13px;margin-right:8px}
.chip.used{display:none}
.fb{border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.75}
.fb.ok{background:#e7f6ee}.fb.ng{background:#fdecec}
.fb h3{margin:0 0 4px;font-size:16px}
.fb .ans{font-weight:800;margin-bottom:4px}
.why{margin-top:8px;border-top:1px dashed rgba(0,0,0,.12);padding-top:6px}
.why div{margin:4px 0}.why .no{font-weight:900;color:var(--ky)}.why .okm{color:var(--ok);font-weight:800}.why .ngm{color:var(--ng);font-weight:800}
.tip{background:var(--kysoft);border-left:4px solid var(--ky);border-radius:8px;padding:9px 11px;margin-top:10px;font-size:14px;line-height:1.7}
.tip b.h{color:var(--ky)}
.vl{display:inline-block;margin-top:8px;color:#c4302b;font-weight:800;text-decoration:none;font-size:13px;border:1.5px solid #f3c4c2;border-radius:99px;padding:3px 10px;background:#fff}
/* 図解 */
.fig{background:#fbfdfd;border:1.5px solid #e1ecec;border-radius:14px;padding:12px;margin-top:12px;font-size:14px;line-height:1.6}
.fig .ttl{font-weight:800;color:var(--main);font-size:13px;margin-bottom:6px}
.doc{background:#fffdf5;border:1.5px solid #eadfb8;border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.75}
.doc .dt{font-weight:800;font-size:13px;color:#8a6d12;margin-bottom:4px}
.doc table{width:100%;border-collapse:collapse;font-size:13px}.doc th,.doc td{border:1px solid #e6dcb8;padding:5px 6px;text-align:center}.doc th{background:#fbf3d9}
.talk{margin:6px 0}.talk b{color:var(--ky)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:#fff;border:2px solid var(--main2);border-radius:12px;padding:10px;text-align:center}
.box .em{font-size:30px;line-height:1.2}.box b{display:block;font-size:16px;color:var(--main)}.box small{font-size:12px;color:#556}
.box.s{border-color:var(--small)}.box.s b{color:var(--small)}.box.g{border-color:var(--big)}.box.g b{color:var(--big)}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.flow .st{background:#fff;border:2px solid #d4e4e4;border-radius:10px;padding:8px 10px;font-weight:700;text-align:center}
.flow .st.hl{border-color:var(--acc);background:#fff4f1}
.flow .ar{text-align:center;color:var(--main2);font-weight:900;line-height:1}
.flow .st small{display:block;font-weight:400;font-size:12px;color:#667}
.chips3{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tg{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--acc2)}
.tg.s{background:#dceafb;color:#1d5fa3}.tg.g{background:#fde6d4;color:#a4521b}
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;font-size:22px;font-weight:900;color:var(--main);margin:6px 0}
.formula span.v{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--main2);border-radius:10px;padding:2px 8px;min-width:46px}
.formula span.v small{font-size:11px;font-weight:700;color:#556}
.warn{background:#fff4d6;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.6}
table.sum{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
table.sum th,table.sum td{border-bottom:1px solid #e1ecec;padding:8px 4px;text-align:center}
table.sum th{font-size:12px;color:#667}
.hidec>*{visibility:hidden}
.hidec{background:#e9eef0;color:transparent;border-radius:8px;cursor:pointer;user-select:none;position:relative}
.hidec::after{content:"タップ";position:absolute;inset:0;display:grid;place-items:center;color:#8a97a0;font-size:11px;font-weight:700}
.tl{position:relative;padding-left:18px;margin-top:4px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3px;background:var(--main2);border-radius:3px}
.tl div{position:relative;margin:6px 0}.tl div::before{content:"";position:absolute;left:-17px;top:7px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--main2)}
.tl b.y{color:var(--acc);margin-right:6px}
input[type=range]{width:100%;margin-top:10px;accent-color:var(--acc)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:#6b7885}
.sortcard{background:#fff;border:2px solid var(--main2);border-radius:14px;padding:16px;text-align:center;font-size:19px;font-weight:800;margin-top:10px;min-height:64px;display:grid;place-items:center}
.sortbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sortbtn button{border:0;border-radius:14px;padding:14px 6px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit}
.sortbtn .s{background:var(--small)}.sortbtn .g{background:var(--big)}
.score{text-align:center;font-size:54px;font-weight:900;color:var(--main);margin:6px 0 0}
.badge{text-align:center;font-size:22px;font-weight:900;margin-top:4px}
.cmp{text-align:center;margin-top:8px;font-size:14px;font-weight:700}
.cmp .up{color:var(--ok)}.cmp .dn{color:var(--ng)}.cmp .eq{color:#6b7885}
.hist{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.hist span{font-size:12px;background:#f1f5f5;border-radius:8px;padding:3px 7px;color:#556}
.hist span.now{background:var(--acc);color:#fff;font-weight:800}
.rv{border-top:1px solid #eef3f3;padding:10px 0;font-size:14px;line-height:1.65}
.rv .qq{font-weight:700}.rv .aa{color:var(--ok);font-weight:800}.rv .ya{color:var(--ng);font-weight:700}
.next{background:linear-gradient(135deg,#0e6f78,#17939e);color:#fff;border-radius:14px;padding:14px;margin-top:14px;font-size:14px;line-height:1.6}
.next b{font-size:16px}.next a{color:#fff}
.howto{margin:8px 0 0;padding-left:0;list-style:none;font-size:14px;line-height:1.7}
.howto li{display:flex;gap:8px;margin-top:8px}.howto li .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--main);color:#fff;font-weight:900;display:grid;place-items:center;font-size:13px}
.howto li.k .n{background:var(--ky)}
footer{font-size:11px;color:#8a949e;line-height:1.7;margin-top:24px;text-align:center}
/* 2026-10-29 動線マップ：アプリの出口3つ（一覧・チャンネル登録・X）。行き止まりをなくす */
.exits{background:#fff;border:2px solid var(--soft);border-radius:16px;padding:12px 14px;margin-top:16px}
.exits .exh{font-weight:800;font-size:14px;color:var(--main);margin-bottom:4px}
.exits a{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #eef3f3;color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:700}
.exits a:first-of-type{border-top:0}.exits a small{display:block;font-weight:400;color:#6b7780;font-size:12px}
.exits .ei{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
#modal{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#modal .mbox{background:#fff;border-radius:16px;padding:18px;max-width:360px;width:100%}
.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:scale(1);opacity:1}}
b.r{color:var(--acc)}
/* 途中式（1行ずつ） */
.calc6{background:#fff;border:2px dashed #c9dede;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14.5px;line-height:1.85;font-weight:700}
.calc6 div+div{border-top:1px dotted #e1ecec}
.calc6 .x{color:#8a97a0;text-decoration:line-through;text-decoration-color:var(--ng)}
/* 計算ラボの種類切りかえ */
.u6tab{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.u6tab button{border:2px solid var(--main2);background:#fff;color:var(--main);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
.u6tab button.on{background:var(--main2);color:#fff}
/* 景気の波 */
.wave6{display:block;margin:0 auto;max-width:340px;width:100%}

</style>
</head>

const hist = sec => JSON.parse(store.getItem(KEY + "h_" + sec) || "[]");
function record(sec, ok, n) {
  const h = hist(sec), prev = h.length ? h[h.length - 1] : null;
  const best = h.reduce((m, x) => Math.max(m, x.pc), -1);
  const d = new Date(), pc = Math.round(ok / n * 100);

}
function histTag(sec) {
  const h = hist(sec); if (!h.length) return "";
  const last = h[h.length - 1], best = Math.max(...h.map(x => x.pc));
  return `<span class="hs">前回 ${last.ok}/${last.n}（${last.pc}%）・ベスト ${best}%・${h.length}回</span>`;
}
function cmpHtml(r) {
  if (!r) return "";
  const p = r.prev;
  const line = !p ? `<div class="cmp eq">はじめての記録だよ！次はこのスコアを超えよう</div>`
    : r.pc > p.pc ? `<div class="cmp"><span class="up">▲ 前回 ${p.pc}% → 今回 ${r.pc}%（+${r.pc - p.pc}）</span></div>`
    : r.pc < p.pc ? `<div class="cmp"><span class="dn">▼ 前回 ${p.pc}% → 今回 ${r.pc}%</span></div>`
    : `<div class="cmp eq">前回と同じ ${r.pc}%</div>`;
  const best = r.best >= 0 && r.pc > r.best ? `<div class="cmp up">🏅 ベスト更新！（これまで ${r.best}%）</div>` : r.best >= 0 ? `<div class="cmp eq">ベスト ${Math.max(r.best, r.pc)}%</div>` : "";
  const chips = r.all.length > 1 ? `<div class="hist">${r.all.map((x, i) => `<span class="${i === r.all.length - 1 ? "now" : ""}">${x.d} ${x.pc}%</span>`).join("")}</div>` : "";
  return line + best + chips;
}

      <li><span class="n">✓</span><span>どの問題も、<b>前回のスコアとベスト</b>が残るよ。やり直して記録を伸ばそう！</span></li>
    </ul>
    <button class="btn main" id="go">はじめる！</button></div>

}
/* 2026-10-29 動線マップ：出口3つ。一覧ページ（固定URL・note開設後はnoteへ転送）／チャンネル登録／X。クリックは track("out-…") で数える */

/* --- 章：説明カード → 確認問題 --- */
function chapter(i) {
  const c = CH[i]; let k = 0;
  const show = () => {
    if (k >= c.cards.length) {
      return quiz(c.qs, { title: `${c.icon} ${i + 1}. ${c.title}`, label: "確認問題", shuffleQ: false,
        done: res => { markDone(c.id); resultScreen(res, { sec: c.id, title: `${c.icon} ${i + 1}. ${c.title}`, chapter: i }); } });
    }
    const cd = c.cards[k];
    screen(`<div class="card pop"><div class="stage">${c.icon} ${i + 1}. ${c.title}　｜　説明 ${k + 1}/${c.cards.length}</div>
      ${prog(k, c.cards.length)}
      <h2 style="margin-top:12px">${cd.h}</h2>${cd.html()}
      ${vlink(cd.t)}
      <button class="btn main" id="nx">${k + 1 < c.cards.length ? "次へ" : "確認問題へ ✏️"}</button>
      ${k > 0 ? `<button class="btn sub" id="bk">もどる</button>` : ""}
      <button class="btn sub" onclick="home()">ホームにもどる</button></div>`);
    if (cd.after) cleanup = cd.after();
    $("#nx").onclick = () => { k++; show(); };
    if (k > 0) $("#bk").onclick = () => { k--; show(); };
  };
  show();
}

/* --- 問題ランナー（4択・○×・並べ替え・共通テスト形式） --- */
function quiz(list, opt) {
  let i = 0; const res = [];
  const one = () => {
    if (i >= list.length) return opt.done(res);
    const q = list[i];
    let body = "";
    if (q.k === "mc") {
      const order = q.ky ? q.c.map((_, j) => j) : shuffle(q.c.map((_, j) => j));
      body = `<div class="choices${q.ky ? " kyc" : ""}">${order.map((j, n) => `<button data-j="${j}">${q.ky ? `<span class="no">${NO[n]}</span>` : ""}${q.c[j]}</button>`).join("")}</div>`;
    } else if (q.k === "tf") {
      body = `<div class="tf"><button class="o" data-v="1">○</button><button class="x" data-v="0">×</button></div>`;
    } else {
      let pool; do { pool = shuffle(q.items); } while (pool.every((x, j) => x === q.items[j]));
      body = `<div class="muted" style="margin-top:6px">古い順・正しい順に、下からタップして並べよう</div>
        <div class="answer" id="ans"><div class="ph">ここに並ぶよ</div></div>
        <div class="pool" id="pool">${pool.map(x => `<button class="chip">${x}</button>`).join("")}</div>
        <div class="row2"><button class="btn sub" id="rs">やり直す</button><button class="btn main" id="ck" disabled>答え合わせ</button></div>`;
    }
    screen(`<div class="card pop"><div class="stage">${opt.title}　｜　${opt.label} ${i + 1}/${list.length}</div>${prog(i, list.length)}
      ${q.fmt ? `<span class="fmt">${q.fmt}</span>` : ""}${q.pre ? q.pre : ""}
      <div class="q">${q.k === "tf" ? "○か×か？<br>" : ""}${q.q}</div>${body}<div id="fbx"></div></div>
      <button class="btn sub" id="hm">ホームにもどる</button>`);
    $("#hm").onclick = askHome;
    const finish = (ok, ansText, picked) => {
      res.push({ q, ok, picked }); if (ok) addPts(q.ky ? 20 : 10);
      const why = q.w ? `<div class="why">${q.c.map((c, j) => `<div><span class="no">${NO[j]}</span><span class="${j === q.a ? "okm" : "ngm"}">${j === q.a ? "○" : "×"}</span> ${q.w[j]}</div>`).join("")}</div>` : "";
      $("#fbx").innerHTML = `<div class="fb ${ok ? "ok" : "ng"} pop"><h3>${ok ? `⭕ 正解！ +${q.ky ? 20 : 10}pt` : "❌ ざんねん…"}</h3>
        ${ok ? "" : `<div class="ans">正解：${ansText}</div>`}<div>${q.e}</div>${why}
        ${q.tip ? `<div class="tip"><b class="h">🎯 共通テストではこう出る</b><br>${q.tip}</div>` : ""}${vlink(q.t)}</div>
        <button class="btn main" id="nx">${i + 1 < list.length ? "次の問題へ" : "結果を見る"}</button>`;
      $("#nx").onclick = () => { i++; one(); };
      $("#nx").scrollIntoView({ behavior: "smooth", block: "end" });
    };
    if (q.k === "mc") {
      const bs = document.querySelectorAll(".choices button");
      bs.forEach((b, n) => b.onclick = () => {
        const j = Number(b.dataset.j), ok = j === q.a;
        bs.forEach(x => { x.disabled = true; if (Number(x.dataset.j) === q.a) x.classList.add("ok"); });
        if (!ok) b.classList.add("ng");
        finish(ok, (q.ky ? NO[q.a] + " " : "") + q.c[q.a], (q.ky ? NO[j] + " " : "") + q.c[j]);
      });
    } else if (q.k === "tf") {
      document.querySelectorAll(".tf button").forEach(b => b.onclick = () => {
        const v = b.dataset.v === "1", ok = v === q.a;
        document.querySelectorAll(".tf button").forEach(x => { x.disabled = true; if ((x.dataset.v === "1") === q.a) x.classList.add("ok"); });
        if (!ok) b.classList.add("ng");
        finish(ok, q.a ? "○" : "×", v ? "○" : "×");
      });
    } else {
      const picked = [];
      const draw = () => {
        $("#ans").innerHTML = picked.length ? picked.map((x, j) => `<div class="chip"><b>${j + 1}</b>${x}</div>`).join("") : `<div class="ph">ここに並ぶよ</div>`;
        $("#ck").disabled = picked.length !== q.items.length;
      };
      document.querySelectorAll("#pool .chip").forEach(b => b.onclick = () => { picked.push(b.textContent); b.classList.add("used"); draw(); });
      $("#rs").onclick = () => { picked.length = 0; document.querySelectorAll("#pool .chip").forEach(b => b.classList.remove("used")); draw(); };
      $("#ck").onclick = () => {
        const ok = picked.every((x, j) => x === q.items[j]);
        $("#ck").disabled = true; $("#rs").disabled = true;
        finish(ok, q.items.map((x, j) => `${j + 1}. ${x}`).join("　→ "), picked.join(" → "));
      };
    }
  };
  one();
}

/* --- ひっかけ・まとめテスト・共通テスト形式 --- */
function traps() { quiz(shuffle(TRAPS), { title: "⚠️ ひっかけ ○×", label: "問題", done: res => { markDone("trap"); resultScreen(res, { sec: "trap", title: "⚠️ ひっかけ ○×" }); } }); }
function test() { quiz(shuffle(ALLQ).slice(0, 15), { title: "📝 まとめテスト", label: "問題", done: res => resultScreen(res, { sec: "test", title: "📝 まとめテスト" }) }); }
function kyotsu() {
  screen(`<div class="card pop"><div class="stage" style="color:var(--ky)">🎯 STEP2　共通テストではこう出る</div>
    <h2 style="margin-top:8px">共通テスト形式 ${KY.qs.length}問</h2>
    ${bubble("important", KY.intro)}
    <div class="tip"><b class="h">この${KY.qs.length}問の形</b><br>${KY.formats}<br>選択肢は共通テストと同じく①②③④…の番号つき。1問ごとに「共通テストではこう出る」解説が出るよ。</div>
    ${histTag("kyotsu") ? `<div style="margin-top:8px">${histTag("kyotsu")}</div>` : ""}
    <button class="btn ky" id="go">はじめる</button><button class="btn sub" onclick="home()">ホームにもどる</button></div>`);
  $("#go").onclick = () => quiz(KY.qs, { title: "🎯 共通テスト形式", label: "問", done: res => { markDone("kyotsu"); resultScreen(res, { sec: "kyotsu", title: "🎯 共通テスト形式", ky: true }); } });
}
function retryWrong(list, opt) {
  quiz(list, { title: opt.title + "（まちがえた問題）", label: "問題", done: res => resultScreen(res, { ...opt, sec: null, retry: true }) });
}

/* --- 結果画面（前回・ベストと比べる＋まちがえた問題の復習） --- */
function resultScreen(res, opt) {
  const ok = res.filter(r => r.ok).length, n = res.length, pc = Math.round(ok / n * 100);
  const wrong = res.filter(r => !r.ok);
  track("done-" + (opt.retry ? "retry" : opt.sec || "other"));
  const r = opt.sec ? record(opt.sec, ok, n) : null;
  if (opt.sec === "test" && pc >= 70) markDone("test");
  const ansOf = q => q.k === "mc" ? (q.ky ? NO[q.a] + " " : "") + q.c[q.a] : q.k === "tf" ? (q.a ? "○" : "×") : q.items.join(" → ");
  const badge = pc === 100 ? "🎉 全問正解！" : pc >= 90 ? "🏆 S級！" : pc >= 70 ? "👍 合格ライン！" : "もう一歩！";
  const msg = opt.ky
    ? (pc >= 80 ? "共通テストの形でも解けたね！この分野の出方は下のまとめでもう一度確認しよう。" : "共通テストは、言葉を知っているだけでなく<b>あてはめ</b>が問われるよ。下のまとめと解説を読んで、もう一度挑戦しよう。")
    : (pc === 100 ? "完璧！この調子で次へいこう！" : pc >= 70 ? "いい感じ！まちがえたところだけ、動画で見直しておこう。" : "大丈夫、ここから伸びるよ。まちがえた問題の「▶ 動画で確認」から、その場面を見直してね。");
  window.__wrong = wrong.map(x => x.q); window.__opt = opt;
  let nextBtn = "";
  if (opt.chapter !== undefined) nextBtn = opt.chapter + 1 < CH.length
    ? `<button class="btn main" onclick="chapter(${opt.chapter + 1})">次の章へ：${CH[opt.chapter + 1].icon} ${CH[opt.chapter + 1].title}</button>`
    : UNIT.lab ? `<button class="btn main" onclick="lab()">${UNIT.lab.icon} ${UNIT.lab.title} へ</button>` : `<button class="btn main" onclick="traps()">⚠️ ひっかけ ○× へ</button>`;
  const again = opt.sec === "trap" ? "traps()" : opt.sec === "test" ? "test()" : opt.sec === "kyotsu" || opt.ky ? "kyotsu()" : opt.chapter !== undefined ? `chapter(${opt.chapter})` : "home()";
  screen(`<div class="card pop"><div class="stage" style="text-align:center">${opt.title}　結果${opt.retry ? "（まちがえた問題だけ）" : ""}</div>
    <div class="score">${opt.chapter !== undefined ? `${ok}/${n}` : pc + "%"}</div><div class="muted" style="text-align:center">${n}問中 ${ok}問 正解</div><div class="badge">${badge}</div>
    ${cmpHtml(r)}
    ${bubble(pc === 100 ? "fist-pump" : pc >= 70 ? "thumbs-up" : "math-trouble", msg)}
    ${opt.ky ? `<div class="tip"><b class="h">🎯 この分野は、共通テストではこう出る</b><br>${KY.summary}</div>` : ""}
    ${wrong.length ? `<button class="btn main" onclick="retryWrong(window.__wrong, window.__opt)">まちがえた${wrong.length}問だけ もう一度</button>` : ""}
    ${nextBtn}
    <button class="btn ${wrong.length || nextBtn ? "sub" : "main"}" onclick="${again}">もう一度チャレンジ</button>
    ${!opt.ky && opt.chapter === undefined && pc >= 70 ? `<button class="btn ky" onclick="kyotsu()">🎯 STEP2 共通テスト形式へ</button>` : ""}
    ${UNIT.lab && !opt.ky ? `<button class="btn lab" onclick="lab()">${UNIT.lab.icon} ${UNIT.lab.title}</button>` : ""}
    <button class="btn sub" onclick="home()">ホームにもどる</button>
    ${EXITS()}
    ${wrong.length ? `<h2 style="margin-top:18px">📒 まちがえた問題の復習</h2>${wrong.map(x => { const q = x.q; return `<div class="rv">${q.fmt ? `<span class="fmt">${q.fmt}</span>` : ""}<div class="qq">${q.q}</div>
      <div class="ya">あなたの答え：${x.picked || "—"}</div><div class="aa">正解：${ansOf(q)}</div><div>${q.e}</div>
      ${q.w ? `<div class="why">${q.c.map((c, j) => `<div><span class="no">${NO[j]}</span><span class="${j === q.a ? "okm" : "ngm"}">${j === q.a ? "○" : "×"}</span> ${q.w[j]}</div>`).join("")}</div>` : ""}
      ${q.tip ? `<div class="tip"><b class="h">🎯 共通テストではこう出る</b><br>${q.tip}</div>` : ""}${vlink(q.t)}</div>`; }).join("")}` : ""}
  </div>`);
  if (pc >= 70) confetti();
}

/* --- 単元ごとの「動かして覚える」（2026-10-24 政経3の形に統一）
   UNIT.lab.modes = [{ label, run(el) }（自由に動かす）| { label, game: {...} }（仕分けゲーム）]
   上にモード切替ボタン（①②…）、下に中身。ゲームは全単元で sortGame を使う。 --- */
function lab() {
  track("lab");
  screen(`<div class="card pop"><div class="stage">${UNIT.lab.icon} ${UNIT.lab.title}</div><div id="labx"></div></div>
    <button class="btn sub" onclick="home()">ホームにもどる</button>`);
  const L = UNIT.lab; let mode = 0, stop = null;
  const render = () => {
    if (stop) { stop(); stop = null; }
    $("#labx").innerHTML = `<div class="row2" style="margin-top:6px">${L.modes.map((m, i) => `<button class="btn ${i === mode ? "main" : "sub"}" id="m${i}" style="margin-top:4px;padding:10px;font-size:14px">${NO[i]} ${m.label}</button>`).join("")}</div><div id="labin"></div>`;
    L.modes.forEach((m, i) => { $("#m" + i).onclick = () => { mode = i; render(); }; });
    const m = L.modes[mode];
    stop = (m.game ? sortGame($("#labin"), m.game) : m.run($("#labin"))) || null;
  };
  render();
  cleanup = () => { if (stop) stop(); };
}
/* 仕分けゲーム（全単元共通）：g = { deck:[{w,a,why}], btns:{key:ラベル}, ask, sec, perfect, retry, fig?(), onPick?(c), extra?(c) } */
function sortGame(el, g) {
  const deck = shuffle(g.deck); let i = 0, ok = 0;
  const one = () => {
    if (i >= deck.length) {
      const r = record(g.sec, ok, deck.length); markDone("lab");
      el.innerHTML = `<div class="score">${ok}/${deck.length}</div><div class="badge">${ok === deck.length ? "🎉 パーフェクト！" : "もう一回やってみよう"}</div>${cmpHtml(r)}
        ${bubble(ok === deck.length ? "fist-pump" : "thinking", ok === deck.length ? g.perfect : g.retry)}
        <button class="btn main" id="again">もう一度</button><button class="btn sub" onclick="traps()">⚠️ ひっかけ ○× へ</button>`;
      $("#again").onclick = () => sortGame(el, g); if (ok === deck.length) confetti(); return;
    }
    const c = deck[i];
    el.innerHTML = `${bubble("explain", g.ask)}
      <div class="fig">${g.fig ? g.fig() : ""}<div class="muted" style="text-align:center">${i + 1} / ${deck.length}　正解 ${ok}</div>
      <div class="sortcard" data-a="${c.a}">${c.w}</div>
      <div class="choices" id="gb">${Object.keys(g.btns).map(k => `<button data-k="${k}">${g.btns[k]}</button>`).join("")}</div><div id="sfb"></div></div>`;
    const bs = document.querySelectorAll("#gb button");
    bs.forEach(b => b.onclick = () => {
      const good = b.dataset.k === String(c.a); if (good) { ok++; addPts(5); }
      bs.forEach(x => { x.disabled = true; if (x.dataset.k === String(c.a)) x.classList.add("ok"); }); if (!good) b.classList.add("ng");
      if (g.onPick) g.onPick(c);
      $("#sfb").innerHTML = `<div class="fb ${good ? "ok" : "ng"} pop"><h3>${good ? "⭕ 正解！ +5pt" : "❌ ざんねん…"}</h3>${c.why}${g.extra ? g.extra(c) : ""}</div><button class="btn main" id="sn">次へ</button>`;
      $("#sn").onclick = () => { i++; one(); };
      $("#sn").scrollIntoView({ behavior: "smooth", block: "end" });
    });
  };
  one();
  return null;
}

/* --- 紙ふぶき --- */
function confetti() {
  const cv = $("#cf"), x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const P = Array.from({ length: 90 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, v: 2 + Math.random() * 3, r: Math.random() * 6.28, c: ["#ff6b57", "#17939e", "#ffd166", "#2f7fd1"][Math.floor(Math.random() * 4)] }));
  let f = 0; const tick = () => { x.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.y += p.v; p.r += .1; x.save(); x.translate(p.x + Math.sin(p.r) * 8, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-4, -3, 8, 6); x.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else x.clearRect(0, 0, cv.width, cv.height); };
  tick();
}

$("#ht1").textContent = LABEL; $("#ht2").innerHTML = UNIT.titleHtml || UNIT.title;

intro();
